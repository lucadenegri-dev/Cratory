[pytest]
testpaths = tests
markers =
    network: tocca la rete reale; escluso di default
addopts = -m 'not network'
filterwarnings =
    default
    ignore:Using `httpx` with `starlette\.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient
    # stdlib 'audioop' deprecato (rimozione Python 3.13), importato da pydub
    # (dipendenza del riconoscitore Shazam) — non è nostro codice da correggere.
    ignore:'audioop' is deprecated and slated for removal in Python 3\.13:DeprecationWarning:pydub.utils
