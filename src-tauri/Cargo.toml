[package]
name = "cratory"
# Non e' la versione dell'app: quella la decide `version` in tauri.conf.json,
# che punta a frontend/package.json, tenuto allineato a VERSION da un test.
# Cargo ne pretende una comunque, e questa non compare da nessuna parte.
version = "0.0.0"
description = "Il guscio desktop di Cratory"
authors = ["Luca De Negri"]
license = "AGPL-3.0"
repository = "https://github.com/lucadenegri-dev/Cratory"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cratory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking"] }
tauri-plugin-dialog = "2.7.2"
# Il webview non apre nulla da se': senza un gestore di nuove finestre
# WKWebView lascia cadere `target="_blank"`, e nel bundle TUTTI i link
# esterni erano inerti. Il ponte lato pagina
# (frontend/components/external-link-bridge.tsx) li consegna qui.
tauri-plugin-opener = "2.5.4"

# L'updater in-place. La sequenza che lo guida sta in src/aggiornamento.rs: il
# backend Python gira DA DENTRO il bundle che si sostituisce, quindi va
# terminato prima dell'installazione e non solo prima del riavvio.
# La documentazione del plugin suggerisce di vincolarlo ai target non mobili;
# qui sta fra le dipendenze normali perche' Cratory non costruisce per
# Android/iOS -- se un giorno lo facesse, va spostato sotto un
# [target."cfg(not(any(target_os = "android", target_os = "ios")))".dependencies].
# `default-features = false` + `native-tls` NON e' una preferenza estetica.
# Il default del plugin e' `rustls-tls`, che attiva `reqwest/rustls-no-provider`:
# rustls senza provider crittografico. Cargo unifica le feature fra tutti i
# consumatori di reqwest, quindi quella scelta arrivava anche al client di
# `backend.rs` -- che parla solo con http://127.0.0.1:8000 e non fa TLS -- e
# `Client::new()` panicava, uccidendo il thread che avvia il backend: app viva
# nella lista processi e finestra mai mostrata (vedi il test di regressione in
# src/backend.rs). Con native-tls il TLS lo fa Security.framework di macOS,
# che c'e' gia', e rustls esce dal grafo. `zip` va riattivata a mano perche'
# stava nel default che abbiamo appena spento: senza, l'updater non sa
# scompattare cio' che scarica.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }

# Solo Unix: serve per mandare SIGTERM al backend prima del SIGKILL di
# riserva (vedi src/backend.rs, termina_processo). Gia' presente in
# Cargo.lock come dipendenza transitiva; qui diventa diretta, alla stessa
# versione gia' risolta.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
