[package]
name = "cratory"
# Non e' la versione dell'app: quella la decide `version` in tauri.conf.json,
# che punta a frontend/package.json, tenuto allineato a VERSION da un test.
# Cargo ne pretende una comunque, e questa non compare da nessuna parte.
version = "0.0.0"
description = "Il guscio desktop di Cratory"
authors = ["Luca De Negri"]
license = "AGPL-3.0"
repository = "https://github.com/lucadenegri-dev/Cratory"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cratory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
