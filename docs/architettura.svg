<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 662" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#787878"/>
    </marker>
    <style>
      .box { fill:#161616; stroke:#2b2b2b; stroke-width:1; }
      .ai  { fill:#161616; stroke:#3d3d3d; stroke-width:1; stroke-dasharray:4 3; }
      .lbl { fill:#ededed; font-size:12px; font-weight:600; }
      .sub { fill:#787878; font-size:10px; }
      .band{ fill:#787878; font-size:11px; letter-spacing:2px; }
      .note{ fill:#787878; font-size:10.5px; }
      .conn{ stroke:#787878; stroke-width:1; fill:none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="662" fill="#0d0d0d"/>

  <!-- Header -->
  <text x="40" y="40" fill="#ededed" font-size="14" font-weight="600" letter-spacing="3">CRATORY</text>
  <text x="132" y="40" fill="#787878" font-size="12" letter-spacing="2">/ ARCHITETTURA</text>
  <line x1="40" y1="56" x2="1140" y2="56" stroke="#2b2b2b" stroke-width="1"/>

  <!-- BAND 01 — INGEST -->
  <text x="40" y="92" class="band">01 — INGEST</text>
  <g text-anchor="middle">
    <rect class="box" x="40"  y="104" width="188" height="56"/>
    <text class="lbl" x="134"  y="128">SPOTIFY / IMPORT</text><text class="sub" x="134" y="145">playlist · liked · testo</text>
    <rect class="box" x="268" y="104" width="188" height="56"/>
    <text class="lbl" x="362"  y="128">PLAYLIST IMPORTER</text><text class="sub" x="362" y="145">normalizza · deduplica</text>
    <rect class="box" x="496" y="104" width="188" height="56"/>
    <text class="lbl" x="590"  y="128">SQLITE</text><text class="sub" x="590" y="145">store locale</text>
    <rect class="box" x="724" y="104" width="188" height="56"/>
    <text class="lbl" x="818"  y="128">FEATURE ENRICHMENT</text><text class="sub" x="818" y="145">catena provider · cache</text>
    <rect class="box" x="952" y="104" width="188" height="56"/>
    <text class="lbl" x="1046" y="128">LIBRARY / GAP</text><text class="sub" x="1046" y="145">stato · analisi buchi</text>
  </g>
  <g>
    <line class="conn" x1="228" y1="132" x2="266" y2="132" marker-end="url(#arrow)"/>
    <line class="conn" x1="456" y1="132" x2="494" y2="132" marker-end="url(#arrow)"/>
    <line class="conn" x1="684" y1="132" x2="722" y2="132" marker-end="url(#arrow)"/>
    <line class="conn" x1="912" y1="132" x2="950" y2="132" marker-end="url(#arrow)"/>
  </g>

  <!-- elbow ingest -> build -->
  <path class="conn" d="M1046,160 L1046,200 L134,200 L134,222" marker-end="url(#arrow)"/>

  <!-- BAND 02 — BUILD -->
  <text x="40" y="248" class="band">02 — BUILD (deterministico + AI validata)</text>
  <g text-anchor="middle">
    <rect class="box" x="40"  y="260" width="188" height="56"/>
    <text class="lbl" x="134"  y="284">CANDIDATE ENGINE</text><text class="sub" x="134" y="301">cap 60 candidate</text>
    <rect class="box" x="268" y="260" width="188" height="56"/>
    <text class="lbl" x="362"  y="284">SET BUILDER</text><text class="sub" x="362" y="301">deterministico</text>
    <rect class="ai"  x="496" y="260" width="188" height="56"/>
    <text class="lbl" x="590"  y="284">AI SET AGENT</text><text class="sub" x="590" y="301">opzionale</text>
    <rect class="box" x="724" y="260" width="188" height="56"/>
    <text class="lbl" x="818"  y="284">VALIDATION ENGINE</text><text class="sub" x="818" y="301">schema Pydantic</text>
    <rect class="box" x="952" y="260" width="188" height="56"/>
    <text class="lbl" x="1046" y="284">SET EDITOR / EXPORT</text><text class="sub" x="1046" y="301">CSV · MD · Spotify</text>
  </g>
  <g>
    <line class="conn" x1="228" y1="288" x2="266" y2="288" marker-end="url(#arrow)"/>
    <line class="conn" x1="456" y1="288" x2="494" y2="288" marker-end="url(#arrow)"/>
    <line class="conn" x1="684" y1="288" x2="722" y2="288" marker-end="url(#arrow)"/>
    <line class="conn" x1="912" y1="288" x2="950" y2="288" marker-end="url(#arrow)"/>
  </g>

  <!-- BAND 03 — DISCOVERY -->
  <text x="40" y="360" class="band">03 — DISCOVERY (per gusto)</text>
  <g>
    <rect class="box" x="40" y="372" width="1100" height="58"/>
    <text class="lbl" x="56" y="396">DISCOVERY · DIG «SCAVA»</text>
    <text class="sub" x="56" y="414">Discogs per genere/etichetta → lead → ranking di gusto nella finestra</text>
  </g>
  <!-- write-back loop into library (right margin) -->
  <path class="conn" d="M1140,372 L1162,372 L1162,90 L1140,90 L1140,104" marker-end="url(#arrow)"/>
  <text x="1136" y="86" class="note" text-anchor="end">write-back in libreria</text>

  <!-- divider before separate corpus -->
  <line x1="40" y1="464" x2="1140" y2="464" stroke="#2b2b2b" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- BAND 04 — MIX ID -->
  <text x="40" y="496" class="band">04 — MIX ID (corpus separato)</text>
  <g text-anchor="middle">
    <rect class="box" x="40"  y="508" width="188" height="56"/>
    <text class="lbl" x="134"  y="532">URL MIX</text><text class="sub" x="134" y="549">SoundCloud · YouTube</text>
    <rect class="box" x="268" y="508" width="188" height="56"/>
    <text class="lbl" x="362"  y="532">yt-dlp</text><text class="sub" x="362" y="549">download temporaneo</text>
    <rect class="box" x="496" y="508" width="188" height="56"/>
    <text class="lbl" x="590"  y="532">ffmpeg</text><text class="sub" x="590" y="549">segmenti audio</text>
    <rect class="box" x="724" y="508" width="188" height="56"/>
    <text class="lbl" x="818"  y="532">SHAZAM</text><text class="sub" x="818" y="549">recognizer</text>
    <rect class="box" x="952" y="508" width="188" height="56"/>
    <text class="lbl" x="1046" y="532">DJSET / DJSETTRACK</text><text class="sub" x="1046" y="549">corpus separato</text>
  </g>
  <g>
    <line class="conn" x1="228" y1="536" x2="266" y2="536" marker-end="url(#arrow)"/>
    <line class="conn" x1="456" y1="536" x2="494" y2="536" marker-end="url(#arrow)"/>
    <line class="conn" x1="684" y1="536" x2="722" y2="536" marker-end="url(#arrow)"/>
    <line class="conn" x1="912" y1="536" x2="950" y2="536" marker-end="url(#arrow)"/>
  </g>
  <text x="40" y="588" class="note">Le tracce dei mix non entrano nella libreria principale: restano un corpus per analisi future.</text>

  <!-- Legend -->
  <rect class="box" x="40"  y="612" width="22" height="14"/>
  <text x="72"  y="623" class="sub">DETERMINISTICO</text>
  <rect class="ai"  x="210" y="612" width="22" height="14"/>
  <text x="242" y="623" class="sub">AI / OPZIONALE</text>
  <text x="420" y="623" class="sub">MONOCROMO · UN SOLO ROSSO RISERVATO AGLI ERRORI</text>
</svg>
